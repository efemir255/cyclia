name: cyclia
description: "A private, offline-first menstrual cycle and women's health companion."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  fl_chart: ^1.3.0
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  intl: ^0.20.3
  local_auth: ^3.0.2
  path: ^1.9.1
  shared_preferences: ^2.5.6
  sqflite_common: ^2.5.14
  sqflite_sqlcipher: ^3.4.1
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  generate: true
